<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complaint History — Resolvix</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="titles">
          <div class="eyebrow">All Cases</div>
          <h1>Complaint history</h1>
        </div>
      </div>
      <a href="complaint-form.html" class="btn btn-primary">+ File a Complaint</a>
    </div>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search by subject or ticket ID…" />
      <div class="chip active" data-status="all">All</div>
      <div class="chip" data-status="open">Open</div>
      <div class="chip" data-status="progress">In Progress</div>
      <div class="chip" data-status="resolved">Resolved</div>
      <div class="chip" data-status="escalated">Escalated</div>
    </div>

    <div id="listMount"></div>
  </main>
</div>

<!-- expanded case detail -->
<div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(9,13,17,0.7);z-index:60;align-items:center;justify-content:center;padding:20px;">
  <div class="panel" style="max-width:560px;width:100%;max-height:86vh;overflow-y:auto;" id="detailPanel"></div>
</div>

<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script>
  Store.requireAuth();
  const user = Store.currentUser();
  Shell.mount('history');

  let activeStatus = 'all';
  let query = '';

  function render() {
    const all = Store.listComplaints(user.id);
    const filtered = all.filter(c => {
      const statusMatch = activeStatus === 'all' || c.status === activeStatus;
      const q = query.toLowerCase();
      const textMatch = !q || c.subject.toLowerCase().includes(q) || c.ticketId.toLowerCase().includes(q);
      return statusMatch && textMatch;
    });

    const mount = document.getElementById('listMount');
    if (!filtered.length) {
      mount.innerHTML = `<div class="empty-state"><h3>No matching cases</h3><p>Try a different filter or search term.</p></div>`;
      return;
    }

    mount.innerHTML = filtered.map(c => `
      <div class="ticket" data-id="${c.id}" style="cursor:pointer;">
        <div class="ticket-body">
          <div class="ticket-id mono">${c.ticketId} · ${Store.formatDate(c.createdAt)}</div>
          <div class="ticket-subject">${c.subject}</div>
          <div class="ticket-meta">
            <span>${c.category}</span>
            <span>Priority: ${c.priority || 'Medium'}</span>
            <span class="badge ${c.status}">${Store.STATUS_LABEL[c.status]}</span>
          </div>
        </div>
        <div class="ticket-stub"><div class="stamp ${c.status}">${Store.STATUS_LABEL[c.status]}</div></div>
      </div>
    `).join('');

    mount.querySelectorAll('.ticket').forEach(el => {
      el.addEventListener('click', () => openDetail(el.dataset.id));
    });
  }

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeStatus = chip.dataset.status;
      render();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    query = e.target.value;
    render();
  });

  function openDetail(id) {
    const c = Store.getComplaint(id);
    if (!c) return;
    const steps = Store.timelineFor(c.status);
    const overlay = document.getElementById('detailOverlay');
    const panel = document.getElementById('detailPanel');

    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div class="ticket-id mono">${c.ticketId}</div>
        <span class="badge ${c.status}">${Store.STATUS_LABEL[c.status]}</span>
      </div>
      <h2 style="font-size:20px;margin-bottom:10px;">${c.subject}</h2>
      <p>${c.description}</p>
      <div class="ticket-meta" style="margin-bottom:18px;">
        <span>${c.category}</span>
        <span>Priority: ${c.priority || 'Medium'}</span>
        <span>Filed ${Store.formatDate(c.createdAt)}</span>
      </div>
      ${c.evidence && c.evidence.length ? `<div class="section-title">Evidence</div><p style="margin-bottom:18px;">${c.evidence.join(', ')}</p>` : ''}
      <div class="section-title">Case timeline</div>
      <div class="timeline">
        ${steps.map(s => `
          <div class="timeline-step ${s.state.startsWith('done') ? 'done' : s.state.startsWith('current') ? 'current' : ''}">
            <div class="t-title">${s.title}${s.state === 'current-escalated' ? ' — escalated for human review' : ''}</div>
            <div class="t-meta">${s.sub}</div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" id="closeDetail">Close</button>
        <a href="chat-interface.html" class="btn btn-primary btn-sm">Chat about this case</a>
      </div>
    `;

    overlay.style.display = 'flex';
    document.getElementById('closeDetail').addEventListener('click', () => overlay.style.display = 'none');
  }

  document.getElementById('detailOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'detailOverlay') e.target.style.display = 'none';
  });

  render();
</script>
</body>
</html>
